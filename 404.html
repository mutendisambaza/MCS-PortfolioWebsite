<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutendi Sambaza</title>
<meta name="description" content="A new site is on the way.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%230d0d0d%22/><text x=%2216%22 y=%2221%22 font-family=%22system-ui%22 font-size=%2214%22 font-weight=%22600%22 fill=%22white%22 text-anchor=%22middle%22>MS</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0d0d0d; --muted: #adadad; --ease: cubic-bezier(0.22, 1, 0.36, 1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: #fff; overflow: hidden;
    font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .stage { position: fixed; inset: 0; overflow: hidden; }

  /* Hana 404: the portrait, desaturated and thrown out of focus */
  .photo {
    position: absolute; inset: -6%;
    background: url("headshot.jpg") 50% 35% / cover no-repeat;
    /* White studio backdrop: pulled down to Hana's mid-grey so the white headline keeps its contrast */
    filter: grayscale(1) blur(16px) brightness(0.58) contrast(1.05);
    opacity: 0; transform: scale(1.08);
    transition: opacity 1.8s var(--ease), transform 1.8s var(--ease);
    will-change: transform;
  }
  .ready .photo { opacity: 1; transform: scale(1); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgb(0 0 0 / 0.55)); }
  .grain {
    position: absolute; inset: -50%; opacity: 0.12; pointer-events: none; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .pill {
    position: absolute; left: 20px; bottom: calc(9.68vw + 44px);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px;
    background: rgb(255 255 255 / 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #0d0d0d; font-size: 16px; font-weight: 500; letter-spacing: -0.03em; text-decoration: none;
    opacity: 0; transform: translateY(16px);
    transition: opacity 1s var(--ease) 0.8s, transform 1s var(--ease) 0.8s, background 0.3s;
  }
  .pill:hover { background: rgb(255 255 255 / 0.6); }
  .ready .pill { opacity: 1; transform: none; }

  h1 {
    position: absolute; inset-inline: 0; bottom: 20px;
    display: flex; justify-content: center; overflow: hidden; padding-bottom: 0.06em;
    font-size: 12.1vw; line-height: 0.8; font-weight: 600; letter-spacing: -0.05em;
    text-transform: uppercase; white-space: nowrap;
  }
  h1 span { display: inline-block; transform: translateY(105%); transition: transform 1.2s var(--ease); }
  .ready h1 span { transform: none; }

  /* Hana's cursor bubble */
  .card {
    position: absolute; top: 0; left: 0; z-index: 2; width: min(402px, calc(100vw - 40px));
    display: flex; flex-direction: column; justify-content: space-between; gap: 72px;
    padding: 24px; border-radius: 20px;
    background: rgb(13 13 13 / 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 22px rgb(0 0 0 / 0.3);
    pointer-events: none; opacity: 0; filter: blur(6px);
    transition: opacity 0.35s var(--ease), filter 0.35s var(--ease);
  }
  .card.on { opacity: 1; filter: none; }
  .card .code { font-size: 24px; line-height: 1.2; font-weight: 500; letter-spacing: -0.04em; }
  .card .body { font-size: 16px; line-height: 1.3; font-weight: 500; letter-spacing: -0.03em; color: var(--muted); }
  .card .body b { color: #fff; font-weight: 500; }

  /* Touch: no cursor to follow, so the card parks above the pill */
  @media (hover: none), (pointer: coarse) {
    .card { opacity: 1; filter: none; top: auto; left: 20px; bottom: calc(9.68vw + 100px); transform: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    .photo, .pill, h1 span, .card { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="photo" id="photo" role="img" aria-label="Portrait of Mutendi Sambaza, blurred"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="card" id="card" aria-live="polite">
      <p class="code">404</p>
      <p class="body"><b>This site is being rebuilt</b> — the old one is gone and something new is on the way. Until then, say hello.</p>
    </div>

    <a class="pill" href="mailto:mcsambaza@gmail.com">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M10 6H2m0 0 3.5-3.5M2 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      Get in touch
    </a>

    <h1 aria-label="Page not found" id="headline"></h1>
  </main>

<script>
  (function () {
    var stage = document.getElementById("stage");
    var photo = document.getElementById("photo");
    var card = document.getElementById("card");
    var h1 = document.getElementById("headline");
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var fine = matchMedia("(hover: hover) and (pointer: fine)").matches;

    // Per-letter rise, as on the hero.
    "Page Not Found".split("").forEach(function (ch, i) {
      var s = document.createElement("span");
      s.setAttribute("aria-hidden", "true");
      s.textContent = ch === " " ? " " : ch;
      s.style.transitionDelay = 0.35 + i * 0.035 + "s";
      h1.appendChild(s);
    });

    var img = new Image();
    img.onload = img.onerror = function () { requestAnimationFrame(function () { document.body.classList.add("ready"); }); };
    img.src = "headshot.jpg";

    if (!fine || reduce) return;

    // Springy follow: card trails the cursor, portrait drifts away from it.
    var mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my, dx = 0, dy = 0;
    var GAP = 16;
    addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse") return;
      mx = e.clientX; my = e.clientY;
      card.classList.add("on");
    });
    document.addEventListener("pointerleave", function () { card.classList.remove("on"); });

    (function tick() {
      var w = innerWidth, h = innerHeight, cw = card.offsetWidth, ch = card.offsetHeight;
      var tx = Math.min(mx + GAP, w - cw - 12);
      var ty = my + ch + GAP + 12 > h ? my - ch - GAP : my + GAP;
      cx += (tx - cx) * 0.22; cy += (ty - cy) * 0.22;
      card.style.transform = "translate(" + cx + "px," + cy + "px)";
      var ddx = (-50 * (mx - w / 2)) / w, ddy = (-50 * (my - h / 2)) / h;
      dx += (ddx - dx) * 0.08; dy += (ddy - dy) * 0.08;
      photo.style.translate = dx + "px " + dy + "px";
      requestAnimationFrame(tick);
    })();
  })();
</script>
</body>
</html>
